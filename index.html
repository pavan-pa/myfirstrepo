<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Web Page</title>
</head>
<body>

    <!-- Main Heading -->
    <h1>Welcome to My Website</h1>

    <!-- Subheading -->
    <h2>About This Page</h2>

    <!-- Text Paragraph with bold and italic styling -->
    <p>This is a basic paragraph of text. HTML allows you to easily format text to make it <strong>bold</strong> or <em>italicized</em>.</p>

    <!-- Hyperlink -->
    <p>Check out more tutorials on <a href="https://www.w3schools.com" target="_blank">W3Schools</a>.</p>

    <!-- Image Entry -->
    <h2>Image Example</h2>
    <img src="https://placeholder.com" alt="A simple placeholder image" width="300" height="150">

    <!-- Unordered List -->
    <h2>My Favorite Core Technologies</h2>
    <ul>
        <li>HTML (Structure)</li>
        <li>CSS (Style)</li>
        <li>JavaScript (Interactivity)</li>
    </ul>

</body>
</html>
